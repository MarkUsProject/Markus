repos:
  -   repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
        -   id: check-illegal-windows-names
        -   id: check-json
            exclude: |
              (?x)^(
                spec/fixtures/files/.*
              )$
        -   id: check-merge-conflict
        -   id: check-yaml
            exclude: |
              (?x)^(
                spec/fixtures/files/.*
              )$
        -   id: end-of-file-fixer
        -   id: trailing-whitespace
  -   repo: https://github.com/rbubley/mirrors-prettier
      rev: v3.9.9
      hooks:
        - id: prettier
          types_or: [javascript, jsx, css, scss, html]
  -   repo: https://github.com/thibaudcolas/pre-commit-stylelint
      rev: v17.16.0
      hooks:
        - id: stylelint
          additional_dependencies: [
              "stylelint@17.14.0",
              "postcss-scss@4.0.9",
              "stylelint-config-sass-guidelines@13.0.0",
              "postcss@8.4.49",
            ]
          args: ["--fix"]
          types_or: ["css", "scss"]
          exclude: |
            (?x)^(
              app/assets/stylesheets/application.css|
              app/assets/stylesheets/common/_reset.scss
            )$
  # Ruby hooks run in the rails Docker Compose service, using the gems in the Gemfile
  - repo: local
    hooks:
      - id: rubocop
        name: rubocop
        entry: .dockerfiles/run-in-docker.sh bundle exec rubocop --autocorrect --force-exclusion --cache-root tmp/rubocop
        language: system
        require_serial: true
        types: ["ruby"]
      - id: erb_lint
        name: erb_lint
        entry: .dockerfiles/run-in-docker.sh bundle exec erb_lint --autocorrect
        language: system
        require_serial: true
        types: ["erb"]
        exclude: |
          (?x)^(
          .*.xml.erb|
          .*/assign_scans.html.erb
          )$
      - id: i18n-tasks-health
        name: i18n-tasks health
        entry: .dockerfiles/run-in-docker.sh bundle exec i18n-tasks health
        language: system
        files: config/locales/
        pass_filenames: false

exclude: vendor

default_language_version:
  node: "24.18.0"

ci:
  autoupdate_schedule: monthly
  # Ruby-based hooks are run in a separate CI task
  skip: [rubocop, erb_lint, i18n-tasks-health]
