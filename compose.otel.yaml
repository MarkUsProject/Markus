# Sends OpenTelemetry traces from MarkUs to a local Grafana at http://localhost:3001 (for development only).
# Usage: docker compose -f compose.yaml -f compose.otel.yaml up
services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    ports:
      - '3001:3000'

  rails:
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318

  resque:
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318

  resque-scheduler:
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
